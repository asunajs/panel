# 交叉编译的容器准备（.github/workflows/release.yml 的 armv7 那一档）。
#
# 为什么需要：rquickjs-sys 没给 armv7-unknown-linux-musleabihf 预生成绑定，
# 走它的 `bindgen` feature 现场生成，而 bindgen 要 **libclang**。
# cross 的镜像里没有，所以在这个目标上先装一层。
[target.armv7-unknown-linux-musleabihf]
pre-build = [
  "apt-get update && apt-get install -y --no-install-recommends libclang-dev clang",
  "echo '--- 诊断：源码挂载与可写性 ---' && ls -ld /project /project/vendor /project/vendor/llrt && ( touch /project/vendor/llrt/.wtest && rm /project/vendor/llrt/.wtest && echo 'VENDOR-WRITABLE' || echo 'VENDOR-READONLY' ) && ( test -f /project/vendor/llrt/sdk.cfg && echo 'SDKCFG-OK' || echo 'SDKCFG-MISSING' ) && ( ls /project/vendor/llrt/bundle/js | head -3 ) && which rustc && rustc -vV | head -3",
]
