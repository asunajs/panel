<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{STATUS}} · 插件面板</title>
    <!-- 错误页是唯一没有 app.js 引导的页面：主题靠这个 8 行的同源脚本兜底
         （CSP 是 script-src self，内联脚本会被拦）。 -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body class="error-body">
    <main class="error-page">
      <div class="error-code">{{STATUS}}</div>
      <h1 class="error-title">{{TITLE}}</h1>
      <p class="error-message">{{MESSAGE}}</p>
      <p class="error-ref">{{REF}}</p>
      <div class="error-actions">
        <!-- target="_top"：错误页也会被**装进插件 iframe**（/plugins/<不存在>/ 就是这个 404）。
             不带 target 时这个链接导航的是 iframe 自己 —— 于是面板套面板（用户 2026-11-14
             报的「错误路由页面的套娃」）。跳到最外层才是「回面板首页」的本意。 -->
        <a class="btn btn-primary" href="/" target="_top">回面板首页</a>
        <a class="btn" href="{{RETRY}}">重试</a>
      </div>
    </main>
  </body>
</html>
