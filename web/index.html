<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>插件面板 · panel-llrt</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text"><strong>插件面板</strong><span>panel-llrt</span></span>
        </div>
        <nav class="nav" aria-label="主导航">
        <a class="nav-item" href="#dashboard" data-view="dashboard"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg><span>仪表盘</span></a>
        <a class="nav-item" href="#plugins" data-view="plugins"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h4v3a2 2 0 0 0 4 0V3h3v4a2 2 0 0 1-2 2h-1v4h1a2 2 0 0 1 2 2v4h-4v-1a2 2 0 0 0-4 0v1H7v-4h1a2 2 0 0 0 0-4H7V7h3V3z"/></svg><span>插件</span></a>
        <a class="nav-item" href="#tasks" data-view="tasks"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>任务</span></a>
        <a class="nav-item" href="#runs" data-view="runs"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>运行记录</span></a>
        <a class="nav-item" href="#logs" data-view="logs"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>日志</span></a>
        </nav>
        <div class="sidebar-foot">
          <div class="engine" id="engine-state"><span class="dot dot-idle"></span><span id="engine-text">连接中…</span></div>
          <div class="meta-row"><span id="version">v—</span><span class="sep">·</span><span id="auth-state">未启用令牌</span></div>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="展开导航" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
            <div class="titles">
              <h1 id="page-title">仪表盘</h1>
              <p class="page-sub" id="page-sub">引擎运行状态与最近活动</p>
            </div>
          </div>
          <div class="topbar-right">
            <span class="pill pill-ok" id="health-pill"><span class="dot"></span><span class="label">引擎健康</span></span>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13a8.5 8.5 0 1 1-9.5-9.5 7 7 0 0 0 9.5 9.5z"/></svg></button>
            <button class="btn" id="refresh-btn" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>刷新</span></button>
          </div>
        </header>

        <div class="banner hidden" id="banner" role="status"></div>

        <main class="content">
          <section class="view" id="view-dashboard" data-view="dashboard">
            <div class="cards" id="stat-cards"></div>
            <div class="split">
              <section class="panel">
                <header class="panel-head"><h2>最近运行</h2><a class="link" href="#runs">查看全部</a></header>
                <div class="panel-body panel-body-tight" id="dash-runs"></div>
              </section>
              <section class="panel">
                <header class="panel-head"><h2>最近日志</h2><a class="link" href="#logs">查看全部</a></header>
                <div class="panel-body panel-body-tight" id="dash-logs"></div>
              </section>
            </div>
          </section>

          <section class="view hidden" id="view-plugins" data-view="plugins">
            <section class="panel">
              <header class="panel-head"><h2>插件</h2><span class="chip" id="plugins-count">0</span></header>
              <div class="panel-body table-wrap">
                <table class="table">
                  <thead><tr><th>名称</th><th class="num">任务数</th><th>状态</th><th class="right">操作</th></tr></thead>
                  <tbody id="plugins-body"></tbody>
                </table>
              </div>
            </section>
          </section>

          <section class="view hidden" id="view-tasks" data-view="tasks">
            <section class="panel">
              <header class="panel-head"><h2>任务</h2><span class="chip" id="tasks-count">0</span></header>
              <div class="panel-body table-wrap">
                <table class="table">
                  <thead><tr>
                    <th>插件</th><th>任务</th><th>计划</th><th class="num">预算</th>
                    <th>下次运行</th><th class="num">跑过</th><th>状态</th><th class="right">操作</th>
                  </tr></thead>
                  <tbody id="tasks-body"></tbody>
                </table>
              </div>
            </section>
          </section>

          <section class="view hidden" id="view-runs" data-view="runs">
            <section class="panel">
              <header class="panel-head"><h2>运行记录</h2><span class="chip" id="runs-count">0</span></header>
              <div class="panel-body table-wrap table-scroll">
                <table class="table">
                  <thead><tr>
                    <th class="num">#</th><th>插件</th><th>任务</th><th>开始</th>
                    <th class="num">耗时</th><th>结果</th><th class="right">操作</th>
                  </tr></thead>
                  <tbody id="runs-body"></tbody>
                </table>
              </div>
            </section>
          </section>

          <section class="view hidden" id="view-logs" data-view="logs">
            <section class="panel panel-fill">
              <header class="panel-head">
                <h2>日志</h2>
                <div class="toolbar">
                  <label class="field"><span class="sr-only">级别</span>
                    <select id="log-level">
                      <option value="">全部级别</option>
                      <option value="info">info</option>
                      <option value="warn">warn</option>
                      <option value="error">error</option>
                    </select>
                  </label>
                  <label class="field"><span class="sr-only">搜索</span>
                    <input id="log-search" type="search" placeholder="搜索插件 / 内容" />
                  </label>
                  <button class="btn btn-ghost" id="log-pause" type="button">暂停</button>
                  <button class="btn btn-ghost" id="log-clear" type="button">清空视图</button>
                </div>
              </header>
              <div class="console" id="logs-view" aria-live="polite"></div>
            </section>
          </section>
        </main>
      </div>
    </div>

    <div class="gate hidden" id="gate">
      <form class="gate-card" id="gate-form">
        <h2>需要面板令牌</h2>
        <p class="muted">这个面板启用了令牌鉴权。令牌只保存在本机浏览器，通过请求头发送，不进 URL。</p>
        <label for="token">面板令牌</label>
        <input id="token" type="password" autocomplete="current-password" required />
        <div class="gate-actions"><button class="btn btn-primary" type="submit">解锁</button></div>
        <p class="hint" id="gate-hint"></p>
      </form>
    </div>

    <div class="drawer hidden" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-backdrop" data-close="1"></div>
      <div class="drawer-panel">
        <header class="drawer-head">
          <h2 id="drawer-title">运行详情</h2>
          <button class="icon-btn" type="button" data-close="1" aria-label="关闭">✕</button>
        </header>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
