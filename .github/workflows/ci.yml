name: CI

# 为什么需要 CI：开发机是 arm64 macOS，跑不了 Linux 二进制，
# 也没法验证交叉编译产物。GitHub 的 ubuntu-24.04-arm runner 是**真 ARM64 Linux 硬件**，
# 正好替掉缺失的「低配 ARM 盒子」，把「能不能在目标平台上跑」这件事真正验证掉。
#
# **什么时候跑（用户实测要求：「不要每次推送都跑 ci，还是要 tag 再跑」）**：
#
#   - 打 tag（`v*`）：跑。这既是发布前的闸门，也是「这一版在真 ARM 上验过了」的凭证
#   - 手动 `workflow_dispatch`：跑。想单独验一次就直接在 Actions 页面点
#   - 别人发 PR：跑（自己往 main 推 commit **不跑**）—— 这是一个不花任何代价的
#     安全网：没有 PR 时它永远不会触发
#
# 为什么不该跟着每次 push 跑：这个项目一轮工作常常十几次提交，其中大部分是文档与
# 前端调整 —— 1 次推送 = 5 个 job ≈ 3 分钟，换来的信息却和上一次几乎一样。
# 真正的验证时机是「要发一版」，而那就是 tag。
#
# 注意：打 tag 时 `release.yml` 也会跑（它要做 musl 产物 + 发 Release + 验 install.sh），
# 两个工作流在 tag 上有重复的构建 —— 那是发布时刻的刻意冗余，不是配置失误。

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# CI 只需要读仓库（多一层显式声明，别依赖事件的默认值）。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # x86_64 Linux：单元测试 + 前端检查 + 冒烟测试
  # ------------------------------------------------------------------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 冒烟里的「外部运行时 / JS 脚本」需要 Node。统一用 22（与适配器一致）；
      # 面板的外部插件门槛是 20.6（见 docs/runtimes.md）。
      # 冒烟里有一项「同一个插件在 Node 里也能跑」，走的是 adapters/node ——
      # 它的门槛是 Node 24（issue #6），所以这里不能用 22。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # clippy 门禁：第二十七轮把 41 条清到 0，之后不许再涨。
      #
      # 它挡的不是风格 —— 是**编译和测试都抓不到**的那类问题：文档注释被后来插入的
      # 代码切断（只有 `cargo doc` 才看得出来）、永远走不到的死分支、
      # `#[cfg(test)] mod tests` 被夹在文件中间。
      # 这里**不加** `cargo fmt --check`：本仓库刻意不用 rustfmt。
      - name: clippy（-D warnings）
        run: cargo clippy --all-targets -- -D warnings

      # unsafe 预算守卫：lint 必须还是 deny，例外**正好** 6 处。
      # 它挡的是「每次加一处 allow 都合法、日积月累没人记得为什么」。
      - name: unsafe 预算守卫
        run: ./scripts/check-unsafe-budget.sh

      - name: 单元测试
        run: cargo test --all-targets

      # 前端资源与视图的静态检查：资源登记表与 web/ 实际文件对账、
      # 每个视图「用到的接口都 import 了」、样式里不许硬编码色值……
      - name: 前端资源与视图的静态检查
        run: node scripts/test-web-assets.mjs

      # 文档检查：相对链接指向的文件是否存在、`#锚点` 是否真的对应一个标题、
      # docs/ 下每份文档是否都进了索引。
      # 锚点失效是**不报错**的坏法（点了只跳页首），人眼几乎发现不了，
      # 而审查 L12 那批文档问题全是这一类 —— 交给脚本。
      - name: 文档链接与索引检查
        run: node scripts/check-docs.mjs

      - name: install.sh 端到端测试（用 shim 假造一个 Release）
        run: bash scripts/test-install.sh

      - name: 构建 release
        run: cargo build --release

      # 冒烟会跑：QuickJS 插件、插件路由、脚本任务（js/py/sh）、优雅退出；
      # 有 Node 时还会加载一个外部 Node 插件、验证超时杀进程组与环境变量白名单。
      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/release/plugin-panel

      - name: 产物信息
        run: |
          ls -lh target/release/plugin-panel
          file target/release/plugin-panel

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-x86_64-linux-gnu
          path: target/release/plugin-panel
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32 位 ARM：armv7l（老树莓派、电视盒子、部分 Termux 设备）
  #
  # GitHub 没有 armv7 原生 runner，用 cross 的 Docker 交叉工具链构建。
  # 只做「能编、静态链接、能在 qemu 里启动」三件事；完整冒烟仍在 x86_64 上跑。
  # ------------------------------------------------------------------
  linux-armv7:
    name: Linux armv7（静态）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cross
        run: cargo install cross --locked

      - name: 构建
        run: |
          cross build --release --target armv7-unknown-linux-musleabihf \
            --features legacy-tls-vendored

      - name: 安装 qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: 校验（ARM + 静态 + 能启动）
        run: |
          BIN=target/armv7-unknown-linux-musleabihf/release/plugin-panel
          file "$BIN"
          file "$BIN" | grep -qiE "ARM|armv7"
          file "$BIN" | grep -qiE "statically linked|static-pie linked"
          if readelf -d "$BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::$BIN 有动态库依赖"
            readelf -d "$BIN" | grep "NEEDED"
            exit 1
          fi
          qemu-arm-static "$BIN" build-info

  # ------------------------------------------------------------------
  # Windows x86_64：外部运行时是 Unix-only，但 QuickJS 必须照常可用
  #
  # **真的跑 Rust 测试**（不只是编译）：这一条是用户明确要求的 ——
  # 「windows 不跑 rust，你自己 ci 解决」。所以这里跑 cargo test，
  # 并且起一次真实进程验证二进制能跑（用户那边只能拿到 .exe，跑不了 rust）。
  #
  # 冒烟脚本（scripts/smoke.py）依赖 Unix 的 SIGTERM / fd 语义，不能直接搬过来；
  # 这里用一个最小的 PowerShell 冒烟：起服务 → 打 /healthz → 打 /readyz → 杀掉。
  # ------------------------------------------------------------------
  windows-x86_64:
    name: Windows x86_64（跑测试 + 冒烟）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译检查（含 tests 的 target）
        run: cargo check --all-targets

      # 这是这一版新增的关键一步：**在 Windows 上真的跑一遍测试**。
      # 之前只 cargo check，测试代码能编译但从没被执行过。
      - name: 跑测试
        run: cargo test

      - name: release 链接
        run: cargo build --release

      - name: 冒烟（起进程 + 探针 + **真加载一个用相对 import 的插件**）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'ppsmoke'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $plugins = Join-Path $tmp 'plugins'
          $tasks = Join-Path $tmp 'tasks'
          New-Item -ItemType Directory -Force -Path (Join-Path $plugins 'js/lib') | Out-Null
          New-Item -ItemType Directory -Force -Path $tasks | Out-Null

          # issue #1 的回归：Windows 上相对 import 曾经全线失效（canonicalize 的
          # verbatim 路径没进 file_url）。只打健康检查是抓不到的 —— 必须真加载一个
          # 用相对 import 的插件，并且看它有没有打印出期望的日志。
          @'
          export const twice = (n) => n * 2;
          '@ | Set-Content -Encoding utf8 (Join-Path $plugins 'js/lib/math.js')
          @'
          import { log } from 'host-api';
          import { twice } from './lib/math.js';
          log('RELIMP-OK ' + twice(21));
          '@ | Set-Content -Encoding utf8 (Join-Path $plugins 'js/relimp.js')

          # issue #11 的回归：脚本任务在 Windows 上曾经是死路。三条路径各钉一个：
          #   1) `.js` + 内嵌 QuickJS（不需要外部 Node）
          #   2) `.ps1` + exe（走 powershell -File，头部写在文件里）
          #   3) `.cmd` + exe（走 cmd /c，`.cmd` 没有 # 注释，所以用边车头部）
          @'
          // @cron @every 1s
          // @runtime quickjs
          log('QJS-SCRIPT-OK ' + (6 * 7));
          '@ | Set-Content -Encoding utf8 (Join-Path $tasks 'qjs.js')
          @'
          # @cron @every 1s
          # @runtime exe
          Write-Output 'PS1-SCRIPT-OK 42'
          '@ | Set-Content -Encoding utf8 (Join-Path $tasks 'hello.ps1')
          @'
          @echo off
          echo CMD-SCRIPT-OK 42
          '@ | Set-Content -Encoding ascii (Join-Path $tasks 'hello.cmd')
          @'
          # @cron @every 1s
          # @runtime exe
          '@ | Set-Content -Encoding ascii (Join-Path $tasks 'hello.cmd.task')

          $env:DB_PATH = Join-Path $tmp 'panel.db'
          $env:PANEL_LOG_DIR = Join-Path $tmp 'logs'
          $env:PLUGINS_DIR = $plugins
          $env:TASKS_DIR = $tasks
          $env:BIND_ADDR = '127.0.0.1:18787'
          $env:PANEL_TOKEN = 'cismoke'
          $env:PANEL_ALLOW_PLAIN_TOKEN = '1'
          $outLog = Join-Path $tmp 'out.log'
          $p = Start-Process -FilePath 'target/release/plugin-panel.exe' -ArgumentList 'serve' -PassThru -NoNewWindow -RedirectStandardOutput $outLog -RedirectStandardError (Join-Path $tmp 'err.log')
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18787/healthz' -TimeoutSec 2
                if ($h.StatusCode -eq 200 -and $h.Content -match 'ok') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              Write-Host '--- stdout ---'; Get-Content $outLog -ErrorAction SilentlyContinue
              throw '服务没起来：/healthz 在 20 秒内没有回 200'
            }
            Write-Host 'ok: /healthz 回了 200'
            $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18787/readyz' -Headers @{ Authorization = 'Bearer cismoke' } -TimeoutSec 5
            Write-Host ('ok: /readyz ' + $r.StatusCode + ' ' + $r.Content)

            # 插件加载是启动时扫目录，给它几秒；日志里必须出现 RELIMP-OK 42
            $hit = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              if ((Get-Content $outLog -Raw -ErrorAction SilentlyContinue) -match 'RELIMP-OK 42') { $hit = $true; break }
            }
            if (-not $hit) {
              Write-Host '--- stdout ---'; Get-Content $outLog -ErrorAction SilentlyContinue
              throw '相对 import 没跑通：日志里没有 RELIMP-OK 42（issue #1 回归）'
            }
            Write-Host 'ok: 相对 import 跑通了（./lib/math.js 解析成功）'

            # 脚本任务三条路径。启动 + 首轮调度要几秒，给 60 秒窗口。
            # ⚠ 不要用「看到第一条就 break」的写法（我自己踩过：那样只能证明跑过一次）。
            $want = @{
              'QJS-SCRIPT-OK 42' = '`.js` + 内嵌 QuickJS'
              'PS1-SCRIPT-OK 42' = '`.ps1` + exe（powershell -File）'
              'CMD-SCRIPT-OK 42' = '`.cmd` + exe（cmd /c，边车头部）'
            }
            $seen = @{}
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              $raw = Get-Content $outLog -Raw -ErrorAction SilentlyContinue
              foreach ($k in $want.Keys) {
                if ($raw -match [regex]::Escape($k)) { $seen[$k] = $true }
              }
              if ($seen.Count -eq $want.Count) { break }
            }
            foreach ($k in $want.Keys) {
              if (-not $seen.ContainsKey($k)) {
                Write-Host '--- stdout ---'; Get-Content $outLog -ErrorAction SilentlyContinue
                throw ("脚本任务没跑通：{0} 没出现 {1}（issue #11 回归）" -f $want[$k], $k)
              }
              Write-Host ('ok: ' + $want[$k] + ' 跑通了')
            }
            # 再确认它**不是只跑一次**：等 4 秒，同一标记至少出现两次。
            Start-Sleep -Seconds 4
            $raw2 = Get-Content $outLog -Raw -ErrorAction SilentlyContinue
            foreach ($k in $want.Keys) {
              $n = ([regex]::Matches($raw2, [regex]::Escape($k))).Count
              if ($n -lt 2) {
                Write-Host '--- stdout ---'; Get-Content $outLog -ErrorAction SilentlyContinue
                throw ("{0} 只出现了 {1} 次：任务没有按 @every 1s 重复触发" -f $k, $n)
              }
              Write-Host ('ok: ' + $k + ' 重复触发了 ' + $n + ' 次')
            }
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: 产物信息
        run: |
          Get-Item target/release/plugin-panel.exe | Format-List Name,Length
          & target/release/plugin-panel.exe --help
          & target/release/plugin-panel.exe build-info
        shell: pwsh

      # 用户那边只能跑二进制，跑不了 rust —— 把产物直接挂到这次 run 上供下载。
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-windows-x86_64
          path: target/release/plugin-panel.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # ARM64 Linux 原生 —— 这就是「低配 ARM 盒子」的真实验证
  # ------------------------------------------------------------------
  linux-aarch64:
    name: Linux aarch64（原生 ARM 硬件）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ARM 上也要跑「外部 Node 插件」的冒烟分支
      # 同上：冒烟里的 Node 适配器项需要 Node 24（issue #6）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 确认 runner 真的是 aarch64
        run: |
          uname -m
          uname -m | grep -q aarch64

      - name: 单元测试
        run: cargo test --all-targets

      - name: 构建 release
        run: cargo build --release

      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/release/plugin-panel

      - name: 产物信息
        run: |
          ls -lh target/release/plugin-panel
          file target/release/plugin-panel

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-aarch64-linux-gnu
          path: target/release/plugin-panel
          if-no-files-found: error

  # ------------------------------------------------------------------
  # aarch64-musl 静态二进制：无 libc 依赖，丢到任何 ARM Linux 上都能跑
  # 在 ARM runner 上原生编译，不需要交叉工具链
  # ------------------------------------------------------------------
  linux-aarch64-musl:
    name: Linux aarch64 musl（静态）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # 静态二进制仍然会 spawn PATH 里的 node / python3；runner 自带 Python 3，
      # 这里显式装 Node 22 让「外部运行时」分支也真的跑到。
      # 同上：冒烟里的 Node 适配器项需要 Node 24（issue #6）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          # musl-gcc + perl/make（后者是 `openssl-src` 编 OpenSSL 要的）
          sudo apt-get install -y musl-tools perl make
          which musl-gcc

      - name: 构建静态二进制
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          # 默认 feature 是 legacy-tls；musl 上它要动态链系统 OpenSSL，静态产物会红。
          # 和 release.yml 一样用 vendored，把 OpenSSL 静态编进去。
          cargo build --release --target aarch64-unknown-linux-musl --features legacy-tls-vendored

      - name: 确认是静态链接
        run: |
          BIN=target/aarch64-unknown-linux-musl/release/plugin-panel
          file "$BIN"
          file "$BIN" | grep -q "aarch64"
          # 同时接受 "statically linked" 与 "static-pie linked"（见 release.yml 的注释）
          file "$BIN" | grep -qiE "statically linked|static-pie linked"
          # 静态的真正含义：ELF 里没有任何动态库依赖
          if readelf -d "$BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::$BIN 有动态库依赖，不是真静态："
            readelf -d "$BIN" | grep "NEEDED"
            exit 1
          fi

      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/aarch64-unknown-linux-musl/release/plugin-panel

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/plugin-panel
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 外部 Node/Bun 运行时（runtime/js）
  #
  # 这是第六十轮新增的：面板切到外部 Node 时，真正跑在子进程里的是 runtime/js，
  # 不是 adapters/node。它有自己的协议（fd0/1/2/3/4）与 host-api，必须单独进 CI。
  # 用例会用真实 fd3/fd4 起一个「假面板」父进程，所以协议改坏会当场红。
  # ------------------------------------------------------------------
  runtime-js:
    name: 外部运行时（runtime/js）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Bun 是可选引擎：装了就跑一版冒烟；没装也不阻塞（面板在 Bun 不可用时回落）。
      # 目前不把 Bun 用例设成门禁 —— 先保证 Node 这条主路径稳定。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        continue-on-error: true

      - name: runtime/js 协议与 host-api 用例
        run: node runtime/js/test/run-tests.mjs

      - name: Bun 版本（可选）
        run: bun --version || true

  # ------------------------------------------------------------------
  # Node 适配器：同一份插件在「没有面板」的 Node 里也要跑通
  #
  # 这是「抽象宿主 API」承诺的证据。CPython 适配器在第六十轮删除，
  # 这里只保留 Node。
  # ------------------------------------------------------------------
  adapters:
    name: 跨运行时适配器（Node）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # node:sqlite 在 22.x 是实验性的：`run()` 绑定参数会报 column index out of range，
      # 子进程还要 --experimental-sqlite。所以门槛是 24（issue #6），不是 22.5。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Node 适配器用例
        run: node test/run-tests.mjs
        working-directory: adapters/node

      - name: 仓库真插件在 Node 下原样跑通（ES 模块 + import 'host-api'）
        run: node bin/run.mjs ../../plugins/js/host-api-demo.js --once
        working-directory: adapters/node

      - name: 运行器的 --job（register_handler 的跨宿主等价物）
        run: node bin/run.mjs ../../plugins/js/panel-jobs.js --job 'echo=@every 1s' --duration 2
        working-directory: adapters/node

  # ------------------------------------------------------------------
  # Node 22：**门槛必须自己说出来**（issue #6）
  #
  # 22.x 上 node:sqlite 是实验性的，绑定参数会报 `column index out of range` ——
  # 那种报错没人能联想到「版本太低」。所以这里不跑用例，只断言：
  # 在 22 上加载适配层**必须**得到一条指出版本门槛的错误。
  # ------------------------------------------------------------------
  adapters-node22:
    name: 跨运行时适配器（Node 22 必须明确拒绝）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 22 上加载必须报「需要 Node 24」
        working-directory: adapters/node
        run: |
          set +e
          out=$(node --input-type=module -e "await import('./src/index.js')" 2>&1)
          code=$?
          set -e
          echo "--- 22 上的输出 ---"
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "::error::Node 22 居然加载成功了 —— 要么该把门槛降回 22，要么 version.js 没生效"
            exit 1
          fi
          if ! echo "$out" | grep -q "需要 Node 24"; then
            echo "::error::报错没有指出版本门槛（issue #6）：用户会看到 column index out of range 之类的天书"
            exit 1
          fi
          echo "ok: 22 上给出了明确的版本门槛提示"

  # ------------------------------------------------------------------
  # 依赖漏洞门禁（安全审计 中14）
  #
  # 为什么单独一个 job：Cargo.lock 里 3 个包命中过 8 条公告（rustls / zip /
  # openssl）。当时逐条论证过「不可达」，但那只是**这一版代码**的性质：
  # 哪天有人给 rustls 加一个自定义 ClientSessionStore、或把 upload.rs 换成
  # `ZipArchive::extract()`，公告立刻就活了。没有门禁就没人会发现。
  #
  # `deny.toml` 里对已论证不可达的公告写了 `ignore` + 理由；新增的会直接红。
  # ------------------------------------------------------------------
  advisories:
    name: 依赖公告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features
