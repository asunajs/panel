name: CI

# 为什么需要 CI：开发机是 arm64 macOS，跑不了 Linux 二进制，
# 也没法验证交叉编译产物。GitHub 的 ubuntu-24.04-arm runner 是**真 ARM64 Linux 硬件**，
# 正好替掉缺失的「低配 ARM 盒子」，把「能不能在目标平台上跑」这件事真正验证掉。
#
# **什么时候跑（用户实测要求：「不要每次推送都跑 ci，还是要 tag 再跑」）**：
#
#   - 打 tag（`v*`）：跑。这既是发布前的闸门，也是「这一版在真 ARM 上验过了」的凭证
#   - 手动 `workflow_dispatch`：跑。想单独验一次就直接在 Actions 页面点
#   - 别人发 PR：跑（自己往 main 推 commit **不跑**）—— 这是一个不花任何代价的
#     安全网：没有 PR 时它永远不会触发
#
# 为什么不该跟着每次 push 跑：这个项目一轮工作常常十几次提交，其中大部分是文档与
# 前端调整 —— 1 次推送 = 4 个 job ≈ 2.5 分钟，换来的信息却和上一次几乎一样。
# 真正的验证时机是「要发一版」，而那就是 tag。
#
# 注意：打 tag 时 `release.yml` 也会跑（它要做 musl 产物 + 发 Release + 验 install.sh），
# 两个工作流在 tag 上有重复的构建 —— 那是发布时刻的刻意冗余，不是配置失误。

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # x86_64 Linux：单元测试 + 冒烟测试
  # ------------------------------------------------------------------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 单元测试
        run: cargo test --all-targets

      # 前端资源与视图的静态检查（76+ 项）：资源登记表与 web/ 实际文件对账、
      # 每个视图「用到的接口都 import 了」、样式里不许硬编码色值……
      #
      # 原来这一步跑的是 scripts/test-panel-frontend.mjs —— 那个脚本在前端拆成
      # 独立文件之后就不存在了。CI 引用一个不存在的脚本，第一次推送就会红，
      # 所以推送前在本机把每一步都跑了一遍。
      - name: 前端资源与视图的静态检查
        run: node scripts/test-web-assets.mjs

      - name: install.sh 端到端测试（用 shim 假造一个 Release）
        run: bash scripts/test-install.sh

      - name: 构建 release
        run: cargo build --release

      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/release/plugin-panel

      - name: 产物信息
        run: |
          ls -lh target/release/plugin-panel
          file target/release/plugin-panel

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-x86_64-linux-gnu
          path: target/release/plugin-panel
          if-no-files-found: error

  # ------------------------------------------------------------------
  # ARM64 Linux 原生 —— 这就是「低配 ARM 盒子」的真实验证
  # ------------------------------------------------------------------
  linux-aarch64:
    name: Linux aarch64（原生 ARM 硬件）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 确认 runner 真的是 aarch64
        run: |
          uname -m
          uname -m | grep -q aarch64

      - name: 单元测试
        run: cargo test --all-targets

      - name: 构建 release
        run: cargo build --release

      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/release/plugin-panel

      - name: 产物信息
        run: |
          ls -lh target/release/plugin-panel
          file target/release/plugin-panel

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-aarch64-linux-gnu
          path: target/release/plugin-panel
          if-no-files-found: error

  # ------------------------------------------------------------------
  # aarch64-musl 静态二进制：无 libc 依赖，丢到任何 ARM Linux 上都能跑
  # 在 ARM runner 上原生编译，不需要交叉工具链
  # ------------------------------------------------------------------
  linux-aarch64-musl:
    name: Linux aarch64 musl（静态）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          which musl-gcc

      - name: 构建静态二进制
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: 确认是静态链接
        run: |
          BIN=target/aarch64-unknown-linux-musl/release/plugin-panel
          file "$BIN"
          file "$BIN" | grep -q "aarch64"
          # 同时接受 "statically linked" 与 "static-pie linked"（见 release.yml 的注释）
          file "$BIN" | grep -qiE "statically linked|static-pie linked"
          # 静态的真正含义：ELF 里没有任何动态库依赖
          if readelf -d "$BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::$BIN 有动态库依赖，不是真静态："
            readelf -d "$BIN" | grep "NEEDED"
            exit 1
          fi

      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/aarch64-unknown-linux-musl/release/plugin-panel

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-panel-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/plugin-panel
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 跨运行时适配器：同一份插件脚本在 Node / CPython 下也要跑通
  #
  # 这两个适配器是「抽象宿主 API」承诺的证据：如果只有 Rust 宿主能跑，
  # 那所谓跨运行时就是一句空话。所以它们必须进 CI，且跑的是**仓库里的真插件文件**。
  # ------------------------------------------------------------------
  adapters:
    name: 跨运行时适配器（Node / CPython）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite 需要 Node 22.5+，别用 runner 自带的旧版本
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node 适配器用例
        run: node test/run-tests.mjs
        working-directory: adapters/node

      - name: CPython 适配器用例
        run: python3 -m unittest discover -s tests -v
        working-directory: adapters/python

      - name: 仓库真插件在 Node 下原样跑通（ES 模块 + import 'host-api'）
        run: node bin/run.mjs ../../plugins/js/host-api-demo.js --once
        working-directory: adapters/node

      - name: 仓库真插件在 CPython 下原样跑通（from host_api import ...）
        run: python3 -m host_api ../../plugins/py/sysinfo.py --once
        working-directory: adapters/python
