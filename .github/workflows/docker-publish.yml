name: Docker

# =============================================================================
# 打 tag → 镜像自动构建并推送到 GitHub Packages（ghcr.io）
# =============================================================================
#
# 这个工作流**不重编 Rust**：它只消费 `release.yml` 刚发布出去的那几个静态产物，
# 装进镜像后推到 ghcr.io —— 「镜像里跑的字节」= 「Release 里发布的字节」。
#
# 为什么挂在 workflow_run 而不是 push:tags：
#   `push: tags` 会和 release.yml 同时起跑，而镜像构建要去下载 Release 资产 ——
#   那一刻 Release 可能还不存在（要么 404，要么得写一段「等它出现」的重试）。
#   workflow_run 是「那个工作流跑完了」的确定信号，产物已经躺在 Release 上了。
#
# ⚠ workflow_run 只在**默认分支上存在这个文件**时才会触发：这个文件要先合并进 main，
#   之后打的 tag 才会自动出镜像。（历史版本可以用下面的 workflow_dispatch 补。）
#
# 需要的能力：仓库 Settings → Actions → Workflow permissions 允许 GITHUB_TOKEN 写
#   包（默认允许）；推送目标是 ghcr.io/<owner>/<repo>，包权限跟着仓库走。
# =============================================================================

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # 手动重推 / 补历史版本
  workflow_dispatch:
    inputs:
      version:
        description: 要构建的 Release tag（如 v0.2.2）
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    # 上游 Release 失败时不要构建一个「产物对不上」的镜像。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 确定要构建的版本
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            # 打 tag 触发时，head_branch 就是那个 tag 名
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::不是版本 tag：$TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "构建版本：$TAG"

      # 多架构（amd64 + arm64）：构建阶段要跑 apk，需要 QEMU 才能出 arm64 那一份。
      # armv7 的产物（plugin-panel-armv7-linux-musleabihf）Dockerfile 也认，
      # 需要的话把 linux/arm/v7 加到下面的 platforms 里即可。
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io（GitHub Packages）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.tag }}
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 产物来源就是本仓库刚发出去的那个 Release —— Dockerfile 按 TARGETARCH
          # 选 plugin-panel-{x86_64,aarch64}-linux-musl，并强制过 SHA256SUMS 校验。
          build-args: |
            PANEL_REPO=${{ github.repository }}
            PANEL_VERSION=${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
