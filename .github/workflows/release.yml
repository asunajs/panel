name: Release

# 目标是「不同用户拿到就能用」：CI 的 artifact 需要登录才能下载，等于没分发。
# 所以打 tag 就自动发布 Release，产物任何人都能直接下。
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 权限按 job 最小化（安全审计 中13）。
# 挂在**工作流级**时，编译 job 也会拿到 write token —— 而它要跑依赖的 build script、
# 仓库里的 smoke.py 与 install.sh，任何一环被投毒都能读 `.git/config` 里的 token
# 推后门 commit / 覆盖 Release 资产。现在只有真正 `gh release create` 的那个 job 能写。
jobs:
  # ------------------------------------------------------------------
  # 每个平台各自原生编译（不是交叉编译），编完顺手冒烟一下
  # ------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 旧手机（Termux）、ARM 盒子、树莓派 3/4/5
          - name: aarch64-linux-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # PC / VPS / 开发机
          - name: x86_64-linux-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          # 不把 GITHUB_TOKEN 写进 .git/config：这个 job 里会跑依赖的 build script
          # 与仓库脚本，它们不该有机会读到推送凭据（安全审计 中13）。
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # 冒烟会跑脚本任务（Python 3 是 runner 自带的）与外部 Node 插件分支；
      # 静态二进制自己 spawn PATH 里的 node，所以构建机上要有 Node 22。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 musl 工具链
        run: |
          sudo apt-get update
          # musl-gcc + perl/make（后者是 `openssl-src` 编 OpenSSL 要的）
          sudo apt-get install -y musl-tools perl make
          which musl-gcc

      - name: 构建静态二进制
        run: |
          # musl target 的默认 linker 不是 musl-gcc，得显式指定，
          # 否则链接出来的是动态依赖 glibc 的二进制，丢到别的设备上就跑不了。
          TARGET_UPPER="$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')"
          TARGET_LOWER="$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "CARGO_TARGET_${TARGET_UPPER}_LINKER=musl-gcc"
          export "CC_${TARGET_LOWER}=musl-gcc"
          # Termux（Android 10+ / targetSdk ≥ 29）不再直接 exec，而是让 termux-exec
          # 去 exec `/system/bin/linker64 <你的程序>`，把 LD_PRELOAD 注进去。
          # bionic 的 linker 只接受 ET_DYN（PIE），**静态 ET_EXEC 会被当场拒绝**：
          #     error: "…/plugin-panel" has unexpected e_type: 2
          # 这就是用户在新版 Termux 上装好、一跑就报的那句（文件本身没坏，sha256 也对）。
          # 所以 ARM 产物必须编成 **static PIE**：ET_DYN + 没有 PT_INTERP ——
          # 「内核直接 exec」和「经 linker」两条路都能走。
          # ARM 的 target spec 没开 static PIE，而 rustc 会**显式**传
          #   self-contained/crt1.o + -nostartfiles + -static
          # 光加 `-C link-arg=-static-pie` 没用：crt1.o 不会被换成 rcrt1.o，链接出来是
          # 「ET_DYN 但没有自搬运启动代码」，一跑就 segfault（CI 上实测过两次）。
          # 所以用一个 linker 包装脚本（scripts/linker-static-pie.sh）把
          #   -static → -static-pie、crt1.o → rcrt1.o、crtbegin/end.o → crtbegin/endS.o
          # 换完和 rustc 给 x86_64-unknown-linux-musl 传的那套**完全一致**（本地用假
          # linker 抓参数对比过）；再配 -C relocation-model=pie 与 CFLAGS=-fPIC 保证全是 PIC。
          # 链接器用 rust-lld + rustup 自带的 musl（含 rcrt1.o），不用 musl-gcc：
          # musl-gcc 那条路实测出来仍是 ET_EXEC（它的 specs 把 -static 又加回去了）。
          if [ "${{ matrix.name }}" = "aarch64-linux-musl" ]; then
            export "CARGO_TARGET_${TARGET_UPPER}_RUSTFLAGS=-C linker=rust-lld -C link-self-contained=yes -C relocation-model=pie"
            export "CARGO_TARGET_${TARGET_UPPER}_LINKER=$GITHUB_WORKSPACE/scripts/linker-static-pie.sh"
            export REAL_LINKER=rust-lld
            export "CFLAGS_${TARGET_LOWER}=-fPIC"
            export CFLAGS="-fPIC"
            export CXXFLAGS="-fPIC"
          fi
          # ⚠ `legacy-tls-vendored`（**不是** `legacy-tls`）：把 OpenSSL **静态编进**
          #   二进制，于是"目标机不用装任何东西"与"直播能用"同时成立。
          #   只开 `legacy-tls` 会动态链系统 libssl —— 下面那条 NEEDED 断言会红，
          #   也就是说这个组合**跑不了**，必须带 vendored。
          cargo build --release --target ${{ matrix.target }} --features legacy-tls-vendored

      - name: 校验产物（架构 + 静态链接）
        run: |
          BIN=target/${{ matrix.target }}/release/plugin-panel
          file "$BIN"
          # 注意 "static-pie linked" 和 "statically linked" 是两种写法：
          # 现代 Rust 在 x86_64-unknown-linux-musl 上默认产出 **static PIE**，
          # `file` 报的是 "static-pie linked"，不含 "statically linked"。
          # 只匹配后者会误判失败（第一次打 tag 就是这么红的：aarch64 绿、x86_64 红）。
          file "$BIN" | grep -qiE "statically linked|static-pie linked"
          # 更硬的一条：静态的**真正含义**是没有动态库依赖 —— 直接看 ELF 的 NEEDED 段。
          # file 的措辞会随工具链版本变，NEEDED 段不会骗人。
          if readelf -d "$BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::$BIN 有动态库依赖，不是真静态："
            readelf -d "$BIN" | grep "NEEDED"
            exit 1
          fi
          case "${{ matrix.name }}" in
            aarch64-*) file "$BIN" | grep -q "aarch64" ;;
            x86_64-*)  file "$BIN" | grep -q "x86-64"  ;;
          esac
          # ARM 必须是 static PIE（ET_DYN、无 PT_INTERP）。这不是洁癖：
          # 新版 Termux 的 termux-exec 会把程序交给 /system/bin/linker64 执行，
          # 而它只认 ET_DYN；ET_EXEC 会报 has unexpected e_type: 2（见 build 步骤注释）。
          # 这条断言是那个不变量的看门人 —— 哪天链接参数被改回去，tag 就该红。
          case "${{ matrix.name }}" in
            aarch64-*)
              if ! readelf -h "$BIN" | grep -q "DYN"; then
                echo "::error::aarch64 产物不是 PIE（ET_DYN）：新版 Termux 上会被 linker 拒绝（has unexpected e_type: 2）"
                readelf -h "$BIN" | head -20
                exit 1
              fi
              if readelf -l "$BIN" | grep -q "INTERP"; then
                echo "::error::static PIE 不该带 PT_INTERP（那是动态链接）"
                exit 1
              fi
              ;;
          esac

      # ⚠ 每一个发出去的产物都**必须**支持直播。
      #   "某一档少了直播"不是一种可接受的配置 —— 它会让用户装完之后
      #   撞上一句 TLS 报错，还得自己去猜"是不是我这版编漏了什么"。
      #   这条断言就是那个不变量的看门人。
      - name: 断言这个产物**真的**支持直播
        run: |
          BIN=target/${{ matrix.target }}/release/plugin-panel
          "$BIN" build-info
          "$BIN" build-info | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["live_supported"] is True, "发出去的产物必须支持直播（legacy-tls-vendored）"; print("ok: 直播可用")'

      - name: 冒烟测试（真的把服务跑起来）
        run: python3 scripts/smoke.py ./target/${{ matrix.target }}/release/plugin-panel

      - name: 打包
        run: |
          cd target/${{ matrix.target }}/release
          cp plugin-panel plugin-panel-${{ matrix.name }}
          sha256sum plugin-panel-${{ matrix.name }} > SHA256SUMS-${{ matrix.name }}
          ls -lh plugin-panel-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/plugin-panel-${{ matrix.name }}
            target/${{ matrix.target }}/release/SHA256SUMS-${{ matrix.name }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32 位 ARM：老树莓派 / 电视盒子 / 部分 Termux 设备
  #
  # GitHub 没有 armv7 原生 runner，所以用 cross + Docker 里的 musl 交叉工具链。
  # 产物仍是静态链接；qemu 只用来跑一次 `build-info`，证明这个二进制能启动。
  # ------------------------------------------------------------------
  armv7:
    name: armv7-linux-musleabihf
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cross
        run: cargo install cross --locked

      - name: 构建 armv7 静态二进制
        # 32 位 ARM 暂时还是 ET_EXEC（不是 static PIE）：
        #   - 换 rust-lld：rustup 自带的 armv7 musl 缺 libatomic，链接直接失败；
        #   - 换 musl-gcc + -static-pie：被 musl-gcc 的 specs 拉回 -static，出来还是 ET_EXEC。
        # 影响面小：跑 armv7 的 Termux 都是老设备（那会儿 Termux 的 targetSdk 还是 28，
        # termux-exec 走直接 exec，ET_EXEC 照样能跑）。有设备验证时再补这一档。
        run: |
          cross build --release --target armv7-unknown-linux-musleabihf \
            --features legacy-tls-vendored

      - name: 安装 qemu（只用来跑一次 build-info）
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: 校验产物（架构 + 静态链接）
        run: |
          BIN=target/armv7-unknown-linux-musleabihf/release/plugin-panel
          file "$BIN"
          file "$BIN" | grep -qiE "ARM|armv7"
          file "$BIN" | grep -qiE "statically linked|static-pie linked"
          if readelf -d "$BIN" 2>/dev/null | grep -q "NEEDED"; then
            echo "::error::$BIN 有动态库依赖，不是真静态："
            readelf -d "$BIN" | grep "NEEDED"
            exit 1
          fi
          qemu-arm-static "$BIN" build-info | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["live_supported"] is True, d; print("ok: armv7 能启动，直播可用")'

      - name: 打包
        run: |
          cd target/armv7-unknown-linux-musleabihf/release
          cp plugin-panel plugin-panel-armv7-linux-musleabihf
          sha256sum plugin-panel-armv7-linux-musleabihf > SHA256SUMS-armv7-linux-musleabihf
          ls -lh plugin-panel-armv7-linux-musleabihf

      - uses: actions/upload-artifact@v4
        with:
          name: dist-armv7-linux-musleabihf
          path: |
            target/armv7-unknown-linux-musleabihf/release/plugin-panel-armv7-linux-musleabihf
            target/armv7-unknown-linux-musleabihf/release/SHA256SUMS-armv7-linux-musleabihf
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 汇总成一个 Release
  # ------------------------------------------------------------------
  release:
    name: 发布
    needs: [build, armv7]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 合并校验和
        run: |
          cd dist
          ls -lh
          cat SHA256SUMS-* | sort -k2 > SHA256SUMS
          rm -f SHA256SUMS-*
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # 发布完自测一遍：不用本地文件，走真实的 Release 下载 + SHA256 校验 + 真的跑起来。
      # 这一步挂了就说明「用户拿到的安装方式」是坏的 —— 比 CI 里的 shim 测试更接近真实。
      - name: 用刚发布的产物验证 install.sh（真下载 / 真校验 / 真启动）
        env:
          PANEL_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          PANEL_PREFIX="$RUNNER_TEMP/panel" bash install.sh
          ls -lh "$RUNNER_TEMP/panel/plugin-panel"

          # 令牌是必须的：没有就拒绝启动（第十五轮删掉了「本机免登录」）。
          # 用摘要形态启动，和真实部署一致；`X-Panel-Token` 要的是摘要，不是口令。
          BIN="$RUNNER_TEMP/panel/plugin-panel"
          PANEL_TOKEN_HASH="$(printf '%s' 'release-verify' | "$BIN" hash-token | head -1)"
          PANEL_DIGEST="$(printf '%s' 'release-verify' | "$BIN" digest)"
          PANEL_TOKEN_HASH="$PANEL_TOKEN_HASH" BIND_ADDR=127.0.0.1:8899 \
            DB_PATH="$RUNNER_TEMP/panel/panel.db" \
            "$BIN" > "$RUNNER_TEMP/panel.log" 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do
            curl -fsS -H "X-Panel-Token: $PANEL_DIGEST" \
              http://127.0.0.1:8899/api/state >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -H "X-Panel-Token: $PANEL_DIGEST" \
            http://127.0.0.1:8899/api/state | head -c 200
          echo
          kill -TERM "$PID"
          wait "$PID" || true

          # 关闭路径的证据要挑**现在真的会打印**的字符串。
          #
          # 原来这里 grep 的是「引擎线程已退出」—— 多执行线程之后，那句话变成了
          # 「[engine:N] 执行线程已退出」，于是这一步**永远**失败（第一次跑 Release
          # 就红在这；而它前面「真下载 / 真校验 / 真启动」全过了）。
          grep -q "执行线程已退出" "$RUNNER_TEMP/panel.log"
          # PocketPy / Python 插件在第六十轮删除：产物日志里不该再出现它。
          # 这条是「旧构建混进 Release」的看门狗 —— 不是历史洁癖。
          ! grep -qi "pocketpy" "$RUNNER_TEMP/panel.log"
          # 外部运行时是子进程：面板退出后不应留下 runner.mjs（没有启外部插件时本就没有）
          if command -v pgrep >/dev/null 2>&1; then
            ! pgrep -f 'js/runner\.mjs --plugin' >/dev/null 2>&1
          fi
          ! grep -qi "panic" "$RUNNER_TEMP/panel.log"
