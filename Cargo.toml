[package]
name = "plugin-panel"
version = "0.1.0"
edition = "2021"
description = "Rust + QuickJS + PocketPy 动态插件任务面板"

[dependencies]
# HTTP 服务器
axum = "0.8"
# 异步运行时（rt-multi-thread: 多线程调度；signal: Ctrl-C 优雅退出）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
# 嵌入式 JS 引擎：rquickjs 绑定 QuickJS-ng，静态编译进二进制，无外部 .so 依赖。
# loader 特性是给「插件里 import { ... } from 'host-api'」用的：自定义 Resolver/Loader
# 把 host-api 解析成内置模块，插件脚本与 Node 下的一字不差。
rquickjs = { version = "0.14", features = ["loader"] }
# SQLite。bundled = 把 SQLite C 源码一起编译进来，目标机不需要装 libsqlite3
rusqlite = { version = "0.40", features = ["bundled"] }
# 插件 ↔ 宿主之间的 JSON 通信
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 时间格式化
chrono = "0.4"
# 面板鉴权（第十轮）：会话 ID 来自 OS 随机源；令牌/会话 ID 的比较必须是常量时间。
# 这两个 crate 本来就在依赖树里（rustls → ring → getrandom，rustls-webpki → subtle），
# 所以加为直接依赖**不增加任何编译单元** —— 只是把已经编进来的东西显式声明出来。
getrandom = "0.2"
subtle = "2"
# 令牌的**哈希存储**（第十八轮）：面板支持把令牌以「盐 + 哈希」的形式配置
# （PANEL_TOKEN_HASH），本地落盘的不再是可直接复用的明文。
# 用 Argon2id 而不是 SHA-256：令牌虽然通常是高熵随机串，但运维很可能设成
# 一个弱口令，而弱口令在快速哈希面前没有成本可言。Argon2id 是内存硬的，
# 参数（m/t/p）随 PHC 串一起存 —— 校验时从串里读，不依赖这里的默认值。
argon2 = "0.5"
# 指纹缓存用 blake2b-256。它本来就在依赖树里（argon2 → blake2，
# 见上面两条同样的理由），加为直接依赖不增加任何编译单元。
blake2 = "0.10"
# host_api.http_fetch 的传输层：阻塞式 + rustls（内置 webpki 根证书，目标机不需要装 CA）。
# 只用它做「插件发起的出站请求」，服务端仍然是 Axum。
# 实测（cargo zigbuild aarch64-unknown-linux-musl）能出静态 musl 产物，见 docs/performance.md §8.3。
ureq = { version = "3", features = ["rustls"] }
# host_api.ws_* 的传输层：插件用的 **WebSocket 客户端**（第二十一轮）。
#
# 为什么不是"再写一个 HTTP 库"：弹幕是**长连接**，`http_fetch` 那种"一次请求一次响应"
# 的结构接不了它（见 src/wsclient.rs 文件头）。选 tokio-tungstenite 是因为它与面板
# 已有的 tokio 运行时天然同构（异步任务跑在面板的 runtime 上，插件侧仍然是阻塞调用）。
#
# ⚠ `rustls-tls-webpki-roots` 与 ureq 用的是**同一个信任库**（webpki-roots）——
# 「目标机不需要装 CA」这条性质因此对 ws 也成立。
tokio-tungstenite = { version = "0.30", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# host_api.smtp_send 的传输层（第二十三轮）。
#
# 为什么不能复用 ureq：SMTP 是**裸 TCP 上的文本协议**（`EHLO` / `STARTTLS` /
# `DATA` …），ureq 只会发 HTTP 请求，接不了它。而 rustls 的**同步** API
# （`StreamOwned`）刚好够用 —— 插件侧全是阻塞调用（见 http_fetch 的说明），
# 保持同构比省一条线程重要。
#
# 这四个 crate 本来就在依赖树里（ureq → rustls → webpki-roots / base64），
# 加为直接依赖**不增加任何编译单元** —— 和上面 getrandom / blake2 是同一条理由。
# 信任库也用 webpki-roots：与 http_fetch / ws_* 同一份，
# 「目标机不需要装 CA」这条性质因此对邮件也成立。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
base64 = "0.23"
# 上面那个的 Stream/Sink 组合子（`split()` / `next()` / `send()`）。
# 它本来就在依赖树里（tokio-tungstenite 自己依赖它），加为直接依赖不增加编译单元。
futures-util = "0.3"
# `legacy-tls` 那条路用的平台 TLS（见下面 [features]）。
# ⚠ **它是可选的**：默认构建里一个字节都不编。
native-tls = { version = "0.2", optional = true }
# `legacy-tls` 那条路的**HTTP** 客户端。
#
# ⚠ 为什么不直接开 `ureq/native-tls`：它要 `der 0.8.2`，而本机离线缓存里只有 `0.7.10`
#   —— 半版本不兼容 ⇒ 离线根本编不出来（"能不能在离网机器上编"是硬约束，不是偏好）。
# 而 reqwest + native-tls 这一套是 mcloud 生产里用的同一套（本机缓存里全都在）；
# 与它并列的 ureq 继续负责默认那条路，两个后端各自只在自己被选中时出现。
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "native-tls"] }

[features]
default = []
# 「只给 CBC 套件」的上游（2026-10-14 实测：直播侧的 `v.cmcc-cs.cn` 与
# `videoim.cmcc-cs.cn:20102` **只**给 `ECDHE-RSA-AES128-SHA` 那一档）——
# **rustls 不实现任何 CBC 套件**（设计选择，不是配置问题）⇒ 面板的默认构建连不上它们，
# 而 `http_fetch` / `ws_*` 都是 rustls。开这个 feature 就多一条**能谈 CBC** 的路，
# 插件用 `tls:"native"` 显式要（不显式要就还是 rustls，行为与今天完全一致）。
#
# ⚠⚠ **默认必须关**：Linux/musl 上 `native-tls` = OpenSSL，会让静态二进制多一个系统依赖
# （docs/performance.md §8.3 那条性质）。macOS 上它走 Security.framework，不用装 OpenSSL。
# 这就是"给一个上游加兼容"与"给所有部署加负担"之间的取舍 —— 取舍点写在这里：
# 需要的人开，不需要的人一个字节都不受影响。
legacy-tls = ["tokio-tungstenite/native-tls", "native-tls", "dep:reqwest"]

[build-dependencies]
# 编译 vendored 的 pocketpy（amalgamated 单文件 C）—— 见 build.rs 的注释
cc = "1"

# 面向低配 ARM 盒子：体积优先。本轮不验证效果，先把配置占位在这里。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
