[package]
name = "plugin-panel"
version = "0.1.0"
edition = "2021"
description = "Rust + QuickJS 动态插件任务面板（第一轮 MVP）"

[dependencies]
# HTTP 服务器
axum = "0.8"
# 异步运行时（rt-multi-thread: 多线程调度；signal: Ctrl-C 优雅退出）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
# 嵌入式 JS 引擎：rquickjs 绑定 QuickJS-ng，静态编译进二进制，无外部 .so 依赖
rquickjs = "0.14"
# SQLite。bundled = 把 SQLite C 源码一起编译进来，目标机不需要装 libsqlite3
rusqlite = { version = "0.40", features = ["bundled"] }
# 插件 ↔ 宿主之间的 JSON 通信
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 时间格式化
chrono = "0.4"

# 面向低配 ARM 盒子：体积优先。本轮不验证效果，先把配置占位在这里。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
