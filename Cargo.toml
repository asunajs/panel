[package]
name = "plugin-panel"
version = "0.1.11"
edition = "2021"
description = "Rust + QuickJS + Node/Bun 动态插件任务面板"

# unsafe 是**要申报的**，不是随手能用的。
#
# 用 deny 而不是 forbid：forbid 不允许被 #[allow] 覆盖，而这里确实有 7 处
# 必须直接调 libc / Mach 的系统调用（进程组、rusage、fd 传递）。
# 例外一律**函数级** #[allow(unsafe_code)]，并且必须带一句 SAFETY 说明 ——
# scripts/check-unsafe-budget.sh 会断言"例外正好是这几个函数"，多一个少一个都红，
# 免得某天有人顺手又开一个。
[lints.rust]
unsafe_code = "deny"

# 32 位 ARM 没有随 rquickjs-sys 发布的 musl bindings（只有 gnueabihf）。
# 只对 arm 目标打开 bindgen，其他架构继续用 crate 自带的预生成 bindings。
[target.'cfg(target_arch = "arm")'.dependencies]
rquickjs = { version = "0.14", features = ["loader", "bindgen"] }

[dependencies]
# HTTP 服务器
axum = { version = "0.8", features = ["multipart"] }
# 异步运行时（rt-multi-thread: 多线程调度；signal: Ctrl-C 优雅退出）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
# 嵌入式 JS 引擎：rquickjs 绑定 QuickJS-ng，静态编译进二进制，无外部 .so 依赖。
# loader 特性是给「插件里 import { ... } from 'host-api'」用的：自定义 Resolver/Loader
# 把 host-api 解析成内置模块，插件脚本与 Node 下的一字不差。
rquickjs = { version = "0.14", features = ["loader"] }
# SQLite。bundled = 把 SQLite C 源码一起编译进来，目标机不需要装 libsqlite3。
# hooks = authorizer + progress_handler（插件 SQL 的权限白名单与执行超时，
# 见 src/hostapi.rs 的 `install_plugin_sql_guard`）；不开它这两个 API 根本不存在。
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
# 插件 ↔ 宿主之间的 JSON 通信
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 时间格式化
chrono = "0.4"
# 显式时区（unpanel 2.3）：只有校验 PANEL_TZ 时需要，不参与日常时间运算。
chrono-tz = "0.10"
# 面板鉴权（第十轮）：会话 ID 来自 OS 随机源；令牌/会话 ID 的比较必须是常量时间。
# 这两个 crate 本来就在依赖树里（rustls → ring → getrandom，rustls-webpki → subtle），
# 所以加为直接依赖**不增加任何编译单元** —— 只是把已经编进来的东西显式声明出来。
getrandom = "0.2"
subtle = "2"
# 令牌的**哈希存储**（第十八轮）：面板支持把令牌以「盐 + 哈希」的形式配置
# （PANEL_TOKEN_HASH），本地落盘的不再是可直接复用的明文。
# 用 Argon2id 而不是 SHA-256：令牌虽然通常是高熵随机串，但运维很可能设成
# 一个弱口令，而弱口令在快速哈希面前没有成本可言。Argon2id 是内存硬的，
# 参数（m/t/p）随 PHC 串一起存 —— 校验时从串里读，不依赖这里的默认值。
argon2 = "0.5"
# 指纹缓存用 blake2b-256。它本来就在依赖树里（argon2 → blake2，
# 见上面两条同样的理由），加为直接依赖不增加任何编译单元。
blake2 = "0.10"
# host_api.http_fetch 的传输层：阻塞式 + rustls（内置 webpki 根证书，目标机不需要装 CA）。
# 只用它做「插件发起的出站请求」，服务端仍然是 Axum。
# 实测（cargo zigbuild aarch64-unknown-linux-musl）能出静态 musl 产物，见 docs/performance.md §8.3。
ureq = { version = "3", features = ["rustls"] }
# 商城内置 TypeScript 转译：只引 parser/semantic/transformer/codegen，不引
# OXC 的 minifier / isolated declarations。release 下 strip + LTO 后约 +0.9 MiB，
# 这样安装 .ts 不再依赖外部的 Bun 或 Node。
oxc_allocator = "0.154.0"
# ⚠ `oxc_ast` / `oxc_ast_visit` 曾经是直接依赖：`src/jslint.rs`（在源码里找 async/await
# 的编辑期警告）要用它们遍历 AST。第六十四轮删掉 jslint 之后就没有调用方了 ——
# 它们仍然会作为 parser/semantic 的传递依赖被编译，但**不该再直接声明**，
# 否则下次读 Cargo.toml 的人会以为还有个模块在用。
oxc_codegen = "0.154.0"
oxc_parser = "0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
oxc_transformer = "0.154.0"
# host_api.ws_* 的传输层：插件用的 **WebSocket 客户端**（第二十一轮）。
#
# 为什么不是"再写一个 HTTP 库"：弹幕是**长连接**，`http_fetch` 那种"一次请求一次响应"
# 的结构接不了它（见 src/wsclient.rs 文件头）。选 tokio-tungstenite 是因为它与面板
# 已有的 tokio 运行时天然同构（异步任务跑在面板的 runtime 上，插件侧仍然是阻塞调用）。
#
# ⚠ 不启用 `rustls-tls-webpki-roots`：那会把 `webpki-roots 0.26` 拖进来
# （旧根证书，含已不信任的 emSign 中间证书）。`__rustls-tls` 只带 rustls 连接器，
# 根证书在 src/wsclient.rs 里用项目已有的 `webpki-roots 1` 显式注入。
tokio-tungstenite = { version = "0.30", features = ["connect", "handshake", "__rustls-tls"] }
# host_api.smtp_send 的传输层（第二十三轮）。
#
# 为什么不能复用 ureq：SMTP 是**裸 TCP 上的文本协议**（`EHLO` / `STARTTLS` /
# `DATA` …），ureq 只会发 HTTP 请求，接不了它。而 rustls 的**同步** API
# （`StreamOwned`）刚好够用 —— 插件侧全是阻塞调用（见 http_fetch 的说明），
# 保持同构比省一条线程重要。
#
# 这四个 crate 本来就在依赖树里（ureq → rustls → webpki-roots / base64），
# 加为直接依赖**不增加任何编译单元** —— 和上面 getrandom / blake2 是同一条理由。
# 信任库也用 webpki-roots：与 http_fetch / ws_* 同一份，
# 「目标机不需要装 CA」这条性质因此对邮件也成立。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
base64 = "0.23"
# 上传：zip 解压到插件目录 / 任务目录。只编 deflate，不把 bzip2/lzma/zstd 全拖进来。
#
# 2.6 → 9：2.6.1 命中 3 条公告（2026-0367/0368/0369，前提是调用 `extract()`，
# 而 `upload.rs` 是逐条目手工解压 ⇒ 当时不可达）。9 除了修掉那三条，还**自己**
# 会拒「实际解压量 > 声明值」的条目 —— 等于给 zip 炸弹又加了一道，所以直接升上来，
# 不再靠 `deny.toml` 的 ignore 兜。
zip = { version = "9", default-features = false, features = ["deflate"] }
# 插件目录 / 任务目录的文件系统事件（半被动刷新）。
# Linux 用 inotify、macOS 用 FSEvents、Windows 用 ReadDirectoryChangesW；
# 静态 musl 下是系统调用，不引入动态库。事件只负责“快”，30 秒兜底扫描负责“不漏”。
notify = "8.2"
# 外部运行时（src/extproc.rs）：
#   · `kill(-pid, SIGKILL)` 杀整个进程组（插件/脚本可能自己起子进程）
#   · Linux 上的 `prctl(PR_SET_PDEATHSIG)` 兜底，避免面板异常死亡留下孤儿
# libc 本来就在依赖树里（rusqlite / ring / getrandom），加为直接依赖不增加编译单元。
libc = "0.2"
# 上面那个的 Stream/Sink 组合子（`split()` / `next()` / `send()`）。
# 它本来就在依赖树里（tokio-tungstenite 自己依赖它），加为直接依赖不增加编译单元。
futures-util = "0.3"
# `legacy-tls` 那条路用的平台 TLS（见下面 [features]）。
# ⚠ **它是可选的**：默认构建里一个字节都不编。
native-tls = { version = "0.2", optional = true }
# `legacy-tls` 那条路的**HTTP** 客户端。
#
# ⚠ 为什么不直接开 `ureq/native-tls`：它要 `der 0.8.2`，而本机离线缓存里只有 `0.7.10`
#   —— 半版本不兼容 ⇒ 离线根本编不出来（"能不能在离网机器上编"是硬约束，不是偏好）。
# 而 reqwest + native-tls 这一套是 mcloud 生产里用的同一套（本机缓存里全都在）；
# 与它并列的 ureq 继续负责默认那条路，两个后端各自只在自己被选中时出现。
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "native-tls"] }
# `legacy-tls-vendored` 用的那份 OpenSSL（静态编进二进制）。只在那个 feature 下才编。
openssl = { version = "0.10", optional = true }
sha2 = "0.10"
# 备份加密（unpanel 2.10）。原来用 `age`，但上游已归档，且它带进来的
# `crypto-bigint 0.5.5`（RUSTSEC-2026-0387，定时攻击）和 `basic-toml`
# （RUSTSEC-2026-0374，无人维护）都没有升级路径。所以改成直接用三个标准原语：
#   x25519-dalek  —— 密钥协商
#   hkdf          —— 从共享密钥派生 AEAD key
#   chacha20poly1305 —— 分块加密（每块独立 nonce，头里记明文总长防截断）
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"

[features]
# ⚠⚠ **默认就带**（2026-10-17 改）。
#
# 原先是 `default = []`：要直播的人自己开。那个取舍写得很"讲道理"
# （Linux 上 native-tls = OpenSSL，静态二进制会多一个系统依赖），但它把
# **一个功能默认变成残的**：发出去的包跑直播必然失败，用户看到的是一句
# TLS 报错，还得自己去查"我这版是不是没编某个 feature"。
#
# 判断改了：**直播是这个产品的一部分**，不是可选装饰。所以
#   · 默认编上；
#   · 想省那点体积/依赖的人显式 `--no-default-features`；
#   · Linux 静态构建用 `legacy-tls-vendored`（把 OpenSSL **静态链进去**），
#     于是"静态 + 直播"同时成立 —— 见下面那个 feature。
default = ["legacy-tls"]
# 「只给 CBC 套件」的上游（2026-10-14 实测：直播侧的 `v.cmcc-cs.cn` 与
# `videoim.cmcc-cs.cn:20102` **只**给 `ECDHE-RSA-AES128-SHA` 那一档）——
# **rustls 不实现任何 CBC 套件**（设计选择，不是配置问题）⇒ 面板的默认构建连不上它们，
# 而 `http_fetch` / `ws_*` 都是 rustls。开这个 feature 就多一条**能谈 CBC** 的路，
# 插件用 `tls:"native"` 显式要（不显式要就还是 rustls，行为与今天完全一致）。
#
# ⚠⚠ **默认必须关**：Linux/musl 上 `native-tls` = OpenSSL，会让静态二进制多一个系统依赖
# （docs/performance.md §8.3 那条性质）。macOS 上它走 Security.framework，不用装 OpenSSL。
# 这就是"给一个上游加兼容"与"给所有部署加负担"之间的取舍 —— 取舍点写在这里：
# 需要的人开，不需要的人一个字节都不受影响。
legacy-tls = ["tokio-tungstenite/native-tls", "native-tls", "dep:reqwest"]

# 「静态」与「直播」不必二选一：把 OpenSSL **编进二进制**（vendored）。
#
# 什么时候用：`*-unknown-linux-musl` 的发布产物 —— 那种二进制承诺
# "目标机不用装任何东西"，而默认的 native-tls 会动态链系统 libssl，
# 正好把这个承诺打破。vendored 之后静态链接，两个性质同时成立。
#
# ⚠ 代价是**构建时间**（本地编一遍 OpenSSL）与**构建机要 perl/make**；
# 用户那边一点代价都没有。这就是该由发布方付的账。
legacy-tls-vendored = ["legacy-tls", "dep:openssl", "openssl/vendored"]

# 面向低配 ARM 盒子：体积优先。本轮不验证效果，先把配置占位在这里。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# （这里曾经有一个 [target.'cfg(target_env = "musl")'.dependencies] 段，只放
#  mimalloc。第六十五轮撤掉了 —— 理由见 src/main.rs 文件头那段注释。
#  教训留在这儿：TOML 的表头会把后面所有条目都算到它名下，直到下一个表头，
#  所以 target 专用依赖必须放文件末尾，否则 rusqlite 之类会全变成 musl-only。）
