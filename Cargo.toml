# 包名沿用上游 rust-plugin-panel 的 `plugin-panel`：这份实现最终要合回原来的主分支，
# 包名改了那边就得跟着改（依赖、脚本、CI 全要动），没必要。
# 二进制名字是 `panel` —— 用户日常敲的就是它，和仓库名 asunajs/panel 一致。
[[bin]]
name = "panel"
path = "src/main.rs"

[package]
name = "plugin-panel"
version = "0.4.1"
edition = "2021"
publish = false

[dependencies]
# vendored 而非 git dep：本机 github.com 直连不通。理由见 docs/architecture.md §1.2。
# 构建前必须先生成 vendor/llrt/bundle/js（node tools/bundle/build.mjs），
# 因为 llrt_core/build.rs 要读它，而它不在上游 git 里。
llrt_core = { path = "vendor/llrt/llrt_core", default-features = false, features = [
  "no-sdk",
  "macro",
  "tls-ring",
  "crypto-rust",
  "intl402",
] }

# rquickjs 与 llrt_core 用的是同一个 crates.io 版本（0.14.0，无 patch），
# 加为直接依赖不增加编译单元，但让 derive 宏能按名字找到它 —— 否则
# JsLifetime / FromJs 的 derive 会报 "could not find rquickjs package"。
# feature 必须与 llrt_core/Cargo.toml:62-66 一致，否则会被拆成两份。
# 面板补丁要用（docs/engine-teardown.md）：卸载插件前摘掉定时器状态。
# 同一个 path 依赖，和 llrt_core 内部用的是同一份。
llrt_timers = { path = "vendor/llrt/modules/llrt_timers" }

rquickjs = { version = "0.14", default-features = false, features = [
  "futures",
  "parallel",
  "rust-alloc",
  "macro",
] }

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "signal",
  "sync",
  "fs",
  "process",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
# 静态资源压一下：app.js 112KB + app.css 41KB 是首屏大头（第 88 轮）。
# 只在有 Accept-Encoding 时压，老浏览器拿到原文，不影响兼容。
tower-http = { version = "0.6", features = ["compression-gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# 结构化调度计划（src/plan.rs）要按 JSON 里的 IANA 时区算「下一次」。
# 从 dev-dependencies 提到正式依赖：cron.rs 的夏令时回归用例本来就依赖它。
chrono-tz = "0.10"
# 本来就在依赖树里（llrt_core → hyper → http），加为直接依赖不增加编译单元。
# ssrf.rs 用 http::Uri 取 host；hostapi.rs 用 Full/BodyExt 造请求体、读响应帧。
http = "1"
bytes = "1"
http-body-util = "0.1"
# cron.rs 的抖动随机源。0.2 已在树里（ring → getrandom），不增加编译单元。
getrandom = "0.2"
# auth.rs 的 PBKDF2 / SHA256 / 系统随机源。ring 0.17 已在树里
# （llrt tls-ring → rustls → ring），加为直接依赖不增加编译单元。
ring = "0.17"
# 引擎边界的 catch_unwind 用 FutureExt。futures 已在依赖树里（rquickjs 的 futures feature）。
futures = "0.3"

# ── WebSocket（插件的长连接能力）──────────────────────────────────────
# 用 tokio-tungstenite 而不是自己写帧：握手/掩码/分片/ping-pong 都是细节坑。
# ⚠ 不启用 rustls-tls-webpki-roots：那条路会拖进 webpki-roots 0.26（旧根证书），
#   我们直接用项目已有的 rustls 0.23 + webpki-roots 1 手工搭 connector（与 http 同一份信任库）。
# 上传 zip：只编 deflate，不把 bzip2/lzma/zstd 全拖进来。
# 9 起会拒「实际解压量 > 声明值」的条目 —— 给 zip 炸弹又多一道，所以用 9。
# 备份加密（移植自基线 unpanel 2.10）：服务端只留公钥，私钥归人保管。
# 三个原语都是标准件：X25519 协商 + HKDF 派生 + ChaCha20-Poly1305 分块加密。
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.23"
# panel.version()/atLeast() 的版本比较。1.x 已在树里（cargo 依赖链），不增加编译单元。
semver = "1"
sha2 = "0.10"
# 装 .ts 插件时做类型擦除（第 108 轮）。0.154.0 全套已在离线缓存里 —— 老面板
# src/market.rs 用的就是这一版，不引 Bun/Node 这种外部运行时。约 +0.9 MiB（release）。
# 只做 TypeScript transform：不 bundle、不解析 panel:host、不生成 sourcemap。
oxc_allocator = "0.154.0"
oxc_codegen = "0.154.0"
oxc_parser = "0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
oxc_transformer = "0.154.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"

# ── legacy TLS（只给 CBC 套件的主机）────────────────────────────────
# rustls **不实现任何 CBC 套件**（设计选择），所以 tls:"native" 必须走平台 TLS。
# native-tls：macOS = Security.framework，Linux = OpenSSL。
native-tls = "0.2"
# 这条路的 HTTP 客户端。只用到 blocking 语义里的“能谈 CBC”这一点。
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# musl 静态发布（.github/workflows/release.yml）要 vendored OpenSSL —— feature 语法
# 要求 openssl-sys 是本 manifest 直接声明的依赖（它本来就在 Linux 的依赖图里：
# native-tls → openssl）。只在 Linux 声明，别把 macOS 的构建卷进 OpenSSL。
[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = "0.9"

# 32 位 ARM 的 musl 目标：rquickjs-sys 0.14 **没有** armv7-unknown-linux-musleabihf
# 的预生成绑定（只有 gnueabihf），直接编会报
#   couldn't find file `…/bindings/armv7-unknown-linux-musleabihf.rs`
# 它自带的 `bindgen` feature 就是为这种情况准备的：现场从同包内的 quickjs 头文件生成。
# 只在这个 cfg 下打开 —— bindgen 要 libclang，不能让它污染常规构建（CI 里靠
# Cross.toml 的 pre-build 在那个容器里装 clang）。
[target.'cfg(all(target_arch = "arm", target_env = "musl"))'.dependencies]
rquickjs-sys = { version = "0.14", features = ["bindgen"] }

[dev-dependencies]
# 路由级测试用 oneshot 直接打 Router，不起真监听。axum 自己就依赖
# tower/util（axum-0.8 Cargo.toml:268-271），所以不增加编译单元。
tower = { version = "0.5", default-features = false, features = ["util"] }

[features]
# musl 静态发布用（.github/workflows/release.yml）：把 OpenSSL 静态编进二进制，
# 否则产物带 NEEDED 段、丢到别的设备跑不了。只在 Linux 目标上启用
# （macOS 的依赖图里没有 openssl-sys，启用这个 feature 会解析失败 —— 我们从不在
# macOS 上开它）。原生开发与测试都不带这个 feature。
vendored-openssl = ["openssl-sys/vendored"]

[lints.rust]
unsafe_code = "deny"

[profile.release]
# 基线是 abort：一个引擎线程 panic 带走整个面板。新版要 unwind + 引擎边界 catch_unwind。
panic = "unwind"

[workspace]